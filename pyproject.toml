[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "json-flow"
version = "0.1.0"
description = "Convert, filter, merge, validate and batch-process JSON, CSV and YAML from the command line."
readme = "README.md"
license = "MIT"
authors = [{ name = "samnesvoj" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
keywords = ["json", "csv", "yaml", "cli", "etl"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
json-flow = "json_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
